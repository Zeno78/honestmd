<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HonestMD - Healthcare Professional Reviews</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-blue: #0A4D68;
            --secondary-teal: #088395;
            --accent-coral: #D94F40;
            --light-bg: #F8FAFB;
            --card-bg: #FFFFFF;
            --text-primary: #1A2332;
            --text-secondary: #5A6C7D;
            --border-color: #E1E8ED;
            --success-green: #05A677;
            --warning-amber: #F59E0B;
        }

        body {
            font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #F8FAFB 0%, #E8F1F5 100%);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }

        .app-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        .header {
            background: var(--card-bg);
            border-bottom: 3px solid var(--primary-blue);
            padding: 24px 40px;
            margin-bottom: 40px;
            box-shadow: 0 4px 20px rgba(10, 77, 104, 0.08);
            animation: slideDown 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes slideDown {
            from {
                transform: translateY(-100%);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1400px;
            margin: 0 auto;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo-image {
            height: 60px;
            width: auto;
        }

        .logo-text h1 {
            font-family: 'DM Serif Display', serif;
            font-size: 2.5rem;
            color: var(--primary-blue);
            margin-bottom: 4px;
        }

        .logo-text .tagline {
            color: var(--text-secondary);
            font-size: 0.95rem;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        .verified-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, var(--success-green), var(--secondary-teal));
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: 500;
            font-size: 0.9rem;
            box-shadow: 0 4px 12px rgba(5, 166, 119, 0.3);
        }

        .verified-icon {
            width: 20px;
            height: 20px;
            border: 2px solid white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        /* Main Content Grid */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 30px;
            margin-bottom: 40px;
        }

        /* Search Panel */
        .search-panel {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 8px 30px rgba(10, 77, 104, 0.1);
            animation: fadeInLeft 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            height: fit-content;
            position: sticky;
            top: 20px;
        }

        @keyframes fadeInLeft {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .panel-title {
            font-family: 'DM Serif Display', serif;
            font-size: 1.8rem;
            color: var(--primary-blue);
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 2px solid var(--border-color);
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-label {
            display: block;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        .input-field {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            font-family: 'IBM Plex Sans', sans-serif;
            transition: all 0.3s ease;
            background: var(--light-bg);
        }

        .input-field:focus {
            outline: none;
            border-color: var(--secondary-teal);
            background: white;
            box-shadow: 0 0 0 4px rgba(8, 131, 149, 0.1);
        }

        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 8px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'IBM Plex Sans', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-blue), var(--secondary-teal));
            color: white;
            box-shadow: 0 6px 20px rgba(8, 131, 149, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(8, 131, 149, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: white;
            color: var(--primary-blue);
            border: 2px solid var(--primary-blue);
            margin-top: 12px;
        }

        .btn-secondary:hover {
            background: var(--light-bg);
        }

        /* Provider Display */
        .provider-display {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 8px 30px rgba(10, 77, 104, 0.1);
            animation: fadeInRight 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            min-height: 400px;
        }

        @keyframes fadeInRight {
            from {
                opacity: 0;
                transform: translateX(30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 400px;
            color: var(--text-secondary);
        }

        .empty-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        .provider-card {
            animation: scaleIn 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .provider-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 24px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
        }

        .provider-name {
            font-family: 'DM Serif Display', serif;
            font-size: 2rem;
            color: var(--primary-blue);
            margin-bottom: 8px;
        }

        .provider-specialty {
            color: var(--text-secondary);
            font-size: 1.1rem;
            font-weight: 300;
        }

        .rating-badge {
            background: linear-gradient(135deg, var(--accent-coral), #E67363);
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 1.5rem;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(217, 79, 64, 0.3);
        }

        .provider-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 30px;
        }

        .detail-item {
            padding: 12px;
            background: var(--light-bg);
            border-radius: 8px;
        }

        .detail-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .detail-value {
            font-weight: 500;
            color: var(--text-primary);
        }

        /* Review Section */
        .review-section {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px solid var(--border-color);
        }

        .section-header {
            font-family: 'DM Serif Display', serif;
            font-size: 1.5rem;
            color: var(--primary-blue);
            margin-bottom: 20px;
        }

        .review-form {
            background: var(--light-bg);
            padding: 24px;
            border-radius: 12px;
            margin-bottom: 30px;
        }

        .rating-input {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .star-btn {
            background: none;
            border: none;
            font-size: 2rem;
            cursor: pointer;
            transition: all 0.2s ease;
            padding: 4px;
        }

        .star-btn:hover {
            transform: scale(1.2);
        }

        .star-filled {
            color: #FFB800;
        }

        .star-empty {
            color: #D1D5DB;
        }

        textarea.input-field {
            min-height: 120px;
            resize: vertical;
        }

        .category-select {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .category-chip {
            padding: 10px 16px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            background: white;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .category-chip:hover {
            border-color: var(--secondary-teal);
        }

        .category-chip.selected {
            background: var(--secondary-teal);
            color: white;
            border-color: var(--secondary-teal);
        }

        /* Reviews List */
        .reviews-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .review-item {
            background: white;
            padding: 20px;
            border-radius: 12px;
            border-left: 4px solid var(--secondary-teal);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            animation: slideInUp 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .review-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .reviewer-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .reviewer-badge {
            background: var(--success-green);
            color: white;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .review-date {
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .review-stars {
            color: #FFB800;
            font-size: 1.2rem;
        }

        .review-categories {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .review-category-tag {
            background: var(--light-bg);
            color: var(--text-secondary);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.8rem;
        }

        .review-text {
            color: var(--text-primary);
            line-height: 1.7;
        }

        /* Search Results */
        .search-results-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 20px;
        }

        .search-result-item {
            background: white;
            padding: 20px;
            border-radius: 12px;
            border: 2px solid var(--border-color);
            cursor: pointer;
            transition: all 0.3s ease;
            animation: slideInUp 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .search-result-item:hover {
            border-color: var(--secondary-teal);
            box-shadow: 0 4px 12px rgba(8, 131, 149, 0.15);
            transform: translateY(-2px);
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 12px;
        }

        .result-name {
            font-family: 'DM Serif Display', serif;
            font-size: 1.3rem;
            color: var(--primary-blue);
            margin: 0;
        }

        .result-npi {
            font-size: 0.85rem;
            color: var(--text-secondary);
            background: var(--light-bg);
            padding: 4px 12px;
            border-radius: 4px;
        }

        .result-details {
            display: flex;
            gap: 20px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        .result-specialty,
        .result-location {
            font-size: 0.95rem;
            color: var(--text-secondary);
        }

        .result-rating {
            color: #FFB800;
            font-weight: 600;
            font-size: 1.1rem;
            margin-top: 8px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        .error-message {
            background: #FEE2E2;
            border: 2px solid var(--accent-coral);
            color: #991B1B;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .success-message {
            background: #D1FAE5;
            border: 2px solid var(--success-green);
            color: #065F46;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        /* Responsive */
        @media (max-width: 968px) {
            .main-grid {
                grid-template-columns: 1fr;
            }

            .search-panel {
                position: static;
            }

            .provider-details {
                grid-template-columns: 1fr;
            }

            .category-select {
                grid-template-columns: 1fr;
            }
        }

        /* Animations */
        .pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: .5;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Mock data store (in production, this would be a backend database)
        const mockReviews = {
            '1234567890': [
                {
                    id: 1,
                    rating: 5,
                    text: 'Dr. Johnson is exceptional in the OR. Her surgical precision and decision-making under pressure are outstanding. She takes time to explain procedures to the team and always maintains a calm demeanor.',
                    categories: ['Clinical Skill', 'Team Collaboration', 'Communication'],
                    reviewerRole: 'Surgical First Assistant',
                    date: '2/10/2026',
                    verified: true
                },
                {
                    id: 2,
                    rating: 5,
                    text: 'Outstanding orthopedic surgeon. Very thorough in her assessments and excellent at teaching residents. Always puts patient safety first.',
                    categories: ['Clinical Skill', 'Teaching Ability', 'Decision Making'],
                    reviewerRole: 'OR Nurse',
                    date: '2/5/2026',
                    verified: true
                }
            ],
            '9876543210': [
                {
                    id: 3,
                    rating: 4,
                    text: 'Dr. Chen is excellent in high-stress emergency situations. Quick thinker and great communicator with the team. Occasionally can be brusque when extremely busy, but always professional.',
                    categories: ['Crisis Management', 'Clinical Skill', 'Decision Making'],
                    reviewerRole: 'Emergency Medicine PA',
                    date: '2/8/2026',
                    verified: true
                }
            ],
            '1467560003': [
                {
                    id: 4,
                    rating: 5,
                    text: 'Dr. Smith has excellent bedside manner and takes time with each patient. His diagnostic skills are sharp and he collaborates well with the entire care team.',
                    categories: ['Bedside Manner', 'Communication', 'Team Collaboration'],
                    reviewerRole: 'Medical Assistant',
                    date: '2/12/2026',
                    verified: true
                }
            ]
        };

        // Demo provider data for testing
        const DEMO_PROVIDERS = {
            '1467560003': {
                npi: '1467560003',
                name: 'John Smith, MD',
                specialty: 'Family Medicine',
                state: 'FL',
                city: 'Orlando'
            },
            '1234567890': {
                npi: '1234567890',
                name: 'Sarah Johnson, MD',
                specialty: 'Orthopedic Surgery',
                state: 'CA',
                city: 'Los Angeles'
            },
            '9876543210': {
                npi: '9876543210',
                name: 'Michael Chen, DO',
                specialty: 'Emergency Medicine',
                state: 'NY',
                city: 'New York'
            }
        };

        const REVIEW_CATEGORIES = [
            'Clinical Skill',
            'Bedside Manner',
            'Communication',
            'Team Collaboration',
            'Decision Making',
            'Work Ethic',
            'Teaching Ability',
            'Crisis Management'
        ];

        function App() {
            const [npiNumber, setNpiNumber] = useState('');
            const [searchName, setSearchName] = useState('');
            const [searchLocation, setSearchLocation] = useState('');
            const [searchSpecialty, setSearchSpecialty] = useState('');
            const [provider, setProvider] = useState(null);
            const [searchResults, setSearchResults] = useState([]);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');
            const [reviews, setReviews] = useState([]);
            const [showReviewForm, setShowReviewForm] = useState(false);
            
            // Review form state
            const [rating, setRating] = useState(0);
            const [reviewText, setReviewText] = useState('');
            const [selectedCategories, setSelectedCategories] = useState([]);
            const [reviewerRole, setReviewerRole] = useState('');
            const [successMessage, setSuccessMessage] = useState('');

            const searchProvider = async () => {
                // Validate input
                const hasNameOrLocation = searchName.trim() || searchLocation.trim();
                const hasNPI = npiNumber && npiNumber.length === 10;

                if (!hasNameOrLocation && !hasNPI) {
                    setError('Please enter a provider name, location, or NPI number');
                    return;
                }

                if (npiNumber && npiNumber.length > 0 && npiNumber.length !== 10) {
                    setError('NPI number must be exactly 10 digits');
                    return;
                }

                setLoading(true);
                setError('');
                setProvider(null);
                setReviews([]);
                setSearchResults([]);
                setSuccessMessage('');

                // If NPI provided, do direct lookup
                if (hasNPI) {
                    // Check demo providers first
                    if (DEMO_PROVIDERS[npiNumber]) {
                        setProvider(DEMO_PROVIDERS[npiNumber]);
                        if (mockReviews[npiNumber]) {
                            setReviews(mockReviews[npiNumber]);
                        }
                        setLoading(false);
                        return;
                    }

                    try {
                        const apiUrl = `https://npiregistry.cms.hhs.gov/api/?version=2.1&number=${npiNumber}`;
                        let response;
                        
                        try {
                            response = await fetch(apiUrl);
                        } catch (corsError) {
                            response = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(apiUrl)}`);
                        }

                        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                        
                        const data = await response.json();

                        if (data.result_count === 0) {
                            setError('No provider found with this NPI number');
                            setLoading(false);
                            return;
                        }

                        const providerData = data.results[0];
                        setProvider(formatProviderData(providerData));
                        if (mockReviews[npiNumber]) {
                            setReviews(mockReviews[npiNumber]);
                        }
                        setLoading(false);
                        return;
                    } catch (err) {
                        console.error('NPI API Error:', err);
                        setError('API connection failed. Try using name/location search instead.');
                        setLoading(false);
                        return;
                    }
                }

                // Name/Location search
                try {
                    const params = new URLSearchParams({
                        version: '2.1',
                        limit: '20'
                    });

                    if (searchName.trim()) {
                        const nameParts = searchName.trim().split(' ');
                        if (nameParts.length === 1) {
                            params.append('last_name', nameParts[0]);
                        } else {
                            params.append('first_name', nameParts[0]);
                            params.append('last_name', nameParts.slice(1).join(' '));
                        }
                    }

                    if (searchLocation.trim()) {
                        // Check if it's a state code (2 letters) or city
                        if (searchLocation.length === 2) {
                            params.append('state', searchLocation.toUpperCase());
                        } else {
                            params.append('city', searchLocation);
                        }
                    }

                    if (searchSpecialty.trim()) {
                        params.append('taxonomy_description', searchSpecialty);
                    }

                    const apiUrl = `https://npiregistry.cms.hhs.gov/api/?${params.toString()}`;
                    let response;

                    try {
                        response = await fetch(apiUrl);
                    } catch (corsError) {
                        response = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(apiUrl)}`);
                    }

                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    
                    const data = await response.json();

                    if (data.result_count === 0) {
                        setError('No providers found matching your search. Try different criteria or check demo data.');
                        setLoading(false);
                        return;
                    }

                    const formattedResults = data.results.map(formatProviderData);
                    setSearchResults(formattedResults);
                    setLoading(false);

                } catch (err) {
                    console.error('Search API Error:', err);
                    
                    // Fallback to demo data search
                    const demoResults = Object.values(DEMO_PROVIDERS).filter(p => {
                        const nameMatch = !searchName || 
                            p.name.toLowerCase().includes(searchName.toLowerCase());
                        const locationMatch = !searchLocation || 
                            p.city.toLowerCase().includes(searchLocation.toLowerCase()) ||
                            p.state.toLowerCase().includes(searchLocation.toLowerCase());
                        const specialtyMatch = !searchSpecialty || 
                            p.specialty.toLowerCase().includes(searchSpecialty.toLowerCase());
                        
                        return nameMatch && locationMatch && specialtyMatch;
                    });

                    if (demoResults.length > 0) {
                        setSearchResults(demoResults);
                        setSuccessMessage('API unavailable - showing demo results. Try: Smith, Johnson, Chen');
                        setTimeout(() => setSuccessMessage(''), 5000);
                    } else {
                        setError('API connection failed. Try demo searches: "Smith", "Johnson", or "Chen"');
                    }
                    setLoading(false);
                }
            };

            const formatProviderData = (providerData) => {
                const basic = providerData.basic;
                const addresses = providerData.addresses;
                const taxonomies = providerData.taxonomies;

                return {
                    npi: providerData.number,
                    name: `${basic.first_name} ${basic.last_name}${basic.credential ? ', ' + basic.credential : ''}`,
                    specialty: taxonomies[0]?.desc || 'General Practice',
                    state: addresses.find(a => a.address_purpose === 'LOCATION')?.state || 'N/A',
                    city: addresses.find(a => a.address_purpose === 'LOCATION')?.city || 'N/A'
                };
            };

            const selectProvider = (selectedProvider) => {
                setProvider(selectedProvider);
                setSearchResults([]);
                
                // Load reviews for this provider
                if (mockReviews[selectedProvider.npi]) {
                    setReviews(mockReviews[selectedProvider.npi]);
                } else {
                    setReviews([]);
                }
            };

            const toggleCategory = (category) => {
                if (selectedCategories.includes(category)) {
                    setSelectedCategories(selectedCategories.filter(c => c !== category));
                } else {
                    setSelectedCategories([...selectedCategories, category]);
                }
            };

            const submitReview = () => {
                if (rating === 0) {
                    setError('Please select a rating');
                    return;
                }
                if (!reviewText.trim()) {
                    setError('Please write a review');
                    return;
                }
                if (selectedCategories.length === 0) {
                    setError('Please select at least one category');
                    return;
                }
                if (!reviewerRole.trim()) {
                    setError('Please enter your role');
                    return;
                }

                const newReview = {
                    id: Date.now(),
                    rating,
                    text: reviewText,
                    categories: selectedCategories,
                    reviewerRole,
                    date: new Date().toLocaleDateString(),
                    verified: true
                };

                // Store in mock database
                if (!mockReviews[provider.npi]) {
                    mockReviews[provider.npi] = [];
                }
                mockReviews[provider.npi].unshift(newReview);
                
                setReviews([newReview, ...reviews]);
                
                // Reset form
                setRating(0);
                setReviewText('');
                setSelectedCategories([]);
                setReviewerRole('');
                setShowReviewForm(false);
                setError('');
                setSuccessMessage('Review submitted successfully! (Note: In production, this would require verification)');

                // Clear success message after 5 seconds
                setTimeout(() => setSuccessMessage(''), 5000);
            };

            const calculateAverageRating = () => {
                if (reviews.length === 0) return 0;
                const sum = reviews.reduce((acc, rev) => acc + rev.rating, 0);
                return (sum / reviews.length).toFixed(1);
            };

            return (
                <div className="app-container">
                    <header className="header">
                        <div className="header-content">
                            <div className="logo-section">
                                <img src="https://raw.githubusercontent.com/zeno78/honestmd/main/logo.png" 
                                     alt="HonestMD Logo" 
                                     className="logo-image" 
                                     onError={(e) => {e.target.style.display='none'}} />
                                <div className="logo-text">
                                    <h1>HonestMD</h1>
                                    <p className="tagline">Healthcare Professional Reviews by Healthcare Professionals</p>
                                </div>
                            </div>
                            <div className="verified-badge">
                                <div className="verified-icon">✓</div>
                                <span>Verified Reviews Only</span>
                            </div>
                        </div>
                    </header>

                    <div className="main-grid">
                        <div className="search-panel">
                            <h2 className="panel-title">Find a Provider</h2>
                            
                            <div className="input-group">
                                <label className="input-label">Provider Name</label>
                                <input
                                    type="text"
                                    className="input-field"
                                    placeholder="First and/or Last Name"
                                    value={searchName}
                                    onChange={(e) => setSearchName(e.target.value)}
                                    onKeyPress={(e) => e.key === 'Enter' && searchProvider()}
                                />
                            </div>

                            <div className="input-group">
                                <label className="input-label">City or State</label>
                                <input
                                    type="text"
                                    className="input-field"
                                    placeholder="e.g., Orlando or FL"
                                    value={searchLocation}
                                    onChange={(e) => setSearchLocation(e.target.value)}
                                    onKeyPress={(e) => e.key === 'Enter' && searchProvider()}
                                />
                            </div>

                            <div className="input-group">
                                <label className="input-label">Specialty (Optional)</label>
                                <input
                                    type="text"
                                    className="input-field"
                                    placeholder="e.g., Cardiology, Surgery"
                                    value={searchSpecialty}
                                    onChange={(e) => setSearchSpecialty(e.target.value)}
                                    onKeyPress={(e) => e.key === 'Enter' && searchProvider()}
                                />
                            </div>

                            <div style={{borderTop: '1px solid var(--border-color)', paddingTop: '16px', marginTop: '16px'}}>
                                <div className="input-group">
                                    <label className="input-label">Or Search by NPI Number</label>
                                    <input
                                        type="text"
                                        className="input-field"
                                        placeholder="10-digit NPI"
                                        value={npiNumber}
                                        onChange={(e) => setNpiNumber(e.target.value.replace(/\D/g, '').slice(0, 10))}
                                        onKeyPress={(e) => e.key === 'Enter' && searchProvider()}
                                    />
                                </div>
                            </div>

                            <button className="btn btn-primary" onClick={searchProvider} disabled={loading}>
                                {loading ? 'Searching...' : 'Search Providers'}
                            </button>

                            {searchResults.length > 0 && !provider && (
                                <button 
                                    className="btn btn-secondary" 
                                    onClick={() => {
                                        setSearchResults([]);
                                        setSearchName('');
                                        setSearchLocation('');
                                        setSearchSpecialty('');
                                        setNpiNumber('');
                                    }}
                                >
                                    Clear Results
                                </button>
                            )}

                            {provider && (
                                <button 
                                    className="btn btn-secondary" 
                                    onClick={() => setShowReviewForm(!showReviewForm)}
                                >
                                    {showReviewForm ? 'Cancel Review' : 'Write a Review'}
                                </button>
                            )}
                        </div>

                        <div className="provider-display">
                            {loading && (
                                <div className="empty-state">
                                    <div className="empty-icon pulse">🔍</div>
                                    <p>Searching providers...</p>
                                </div>
                            )}

                            {!loading && !provider && !error && searchResults.length === 0 && (
                                <div className="empty-state">
                                    <div className="empty-icon">🩺</div>
                                    <p>Search by provider name, location, or NPI number</p>
                                    <p style={{fontSize: '0.9rem', marginTop: '10px', color: 'var(--text-secondary)'}}>
                                        Try: "Smith" or "Orlando" or "Cardiology"
                                    </p>
                                </div>
                            )}

                            {error && (
                                <div className="error-message">
                                    <strong>Error:</strong> {error}
                                </div>
                            )}

                            {successMessage && (
                                <div className="success-message">
                                    <strong>Success:</strong> {successMessage}
                                </div>
                            )}

                            {/* Search Results List */}
                            {searchResults.length > 0 && !provider && (
                                <div>
                                    <h2 className="panel-title">Search Results ({searchResults.length})</h2>
                                    <div className="search-results-list">
                                        {searchResults.map((result) => (
                                            <div 
                                                key={result.npi} 
                                                className="search-result-item"
                                                onClick={() => selectProvider(result)}
                                            >
                                                <div className="result-header">
                                                    <h3 className="result-name">{result.name}</h3>
                                                    <span className="result-npi">NPI: {result.npi}</span>
                                                </div>
                                                <div className="result-details">
                                                    <span className="result-specialty">📋 {result.specialty}</span>
                                                    <span className="result-location">📍 {result.city}, {result.state}</span>
                                                </div>
                                                {mockReviews[result.npi] && (
                                                    <div className="result-rating">
                                                        ★ {(mockReviews[result.npi].reduce((acc, r) => acc + r.rating, 0) / mockReviews[result.npi].length).toFixed(1)} 
                                                        <span style={{marginLeft: '8px', color: 'var(--text-secondary)'}}>
                                                            ({mockReviews[result.npi].length} reviews)
                                                        </span>
                                                    </div>
                                                )}
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {provider && (
                                <div className="provider-card">
                                    <div className="provider-header">
                                        <div>
                                            <h2 className="provider-name">{provider.name}</h2>
                                            <p className="provider-specialty">{provider.specialty}</p>
                                        </div>
                                        {reviews.length > 0 && (
                                            <div className="rating-badge">
                                                ★ {calculateAverageRating()}
                                            </div>
                                        )}
                                    </div>

                                    <div className="provider-details">
                                        <div className="detail-item">
                                            <div className="detail-label">NPI Number</div>
                                            <div className="detail-value">{provider.npi}</div>
                                        </div>
                                        <div className="detail-item">
                                            <div className="detail-label">Location</div>
                                            <div className="detail-value">{provider.city}, {provider.state}</div>
                                        </div>
                                        <div className="detail-item">
                                            <div className="detail-label">Total Reviews</div>
                                            <div className="detail-value">{reviews.length}</div>
                                        </div>
                                        <div className="detail-item">
                                            <div className="detail-label">Specialty</div>
                                            <div className="detail-value">{provider.specialty}</div>
                                        </div>
                                    </div>

                                    {showReviewForm && (
                                        <div className="review-section">
                                            <h3 className="section-header">Submit Your Review</h3>
                                            <div className="review-form">
                                                <div className="input-group">
                                                    <label className="input-label">Your Role *</label>
                                                    <input
                                                        type="text"
                                                        className="input-field"
                                                        placeholder="e.g., Surgical First Assistant, RN, Anesthesiologist"
                                                        value={reviewerRole}
                                                        onChange={(e) => setReviewerRole(e.target.value)}
                                                    />
                                                </div>

                                                <div className="input-group">
                                                    <label className="input-label">Rating *</label>
                                                    <div className="rating-input">
                                                        {[1, 2, 3, 4, 5].map(star => (
                                                            <button
                                                                key={star}
                                                                className={`star-btn ${star <= rating ? 'star-filled' : 'star-empty'}`}
                                                                onClick={() => setRating(star)}
                                                            >
                                                                ★
                                                            </button>
                                                        ))}
                                                    </div>
                                                </div>

                                                <div className="input-group">
                                                    <label className="input-label">Select Categories *</label>
                                                    <div className="category-select">
                                                        {REVIEW_CATEGORIES.map(category => (
                                                            <div
                                                                key={category}
                                                                className={`category-chip ${selectedCategories.includes(category) ? 'selected' : ''}`}
                                                                onClick={() => toggleCategory(category)}
                                                            >
                                                                {category}
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>

                                                <div className="input-group">
                                                    <label className="input-label">Your Review *</label>
                                                    <textarea
                                                        className="input-field"
                                                        placeholder="Share your professional experience working with this provider..."
                                                        value={reviewText}
                                                        onChange={(e) => setReviewText(e.target.value)}
                                                    />
                                                </div>

                                                <button className="btn btn-primary" onClick={submitReview}>
                                                    Submit Review
                                                </button>
                                            </div>
                                        </div>
                                    )}

                                    <div className="review-section">
                                        <h3 className="section-header">
                                            Professional Reviews ({reviews.length})
                                        </h3>
                                        
                                        {reviews.length === 0 ? (
                                            <div style={{textAlign: 'center', padding: '40px', color: 'var(--text-secondary)'}}>
                                                No reviews yet. Be the first to review!
                                            </div>
                                        ) : (
                                            <div className="reviews-list">
                                                {reviews.map(review => (
                                                    <div key={review.id} className="review-item">
                                                        <div className="review-header">
                                                            <div className="reviewer-info">
                                                                <span className="reviewer-badge">
                                                                    ✓ {review.reviewerRole}
                                                                </span>
                                                                <span className="review-date">{review.date}</span>
                                                            </div>
                                                            <div className="review-stars">
                                                                {'★'.repeat(review.rating)}{'☆'.repeat(5 - review.rating)}
                                                            </div>
                                                        </div>
                                                        <div className="review-categories">
                                                            {review.categories.map(cat => (
                                                                <span key={cat} className="review-category-tag">
                                                                    {cat}
                                                                </span>
                                                            ))}
                                                        </div>
                                                        <p className="review-text">{review.text}</p>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
